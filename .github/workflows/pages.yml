# Build -> validate -> verify determinism -> deploy dist/site to GitHub Pages.
# PRs and non-main branches: validate only. main: validate + deploy.
# workflow_dispatch with `ref` redeploys any tag (rollback).
name: pages
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "git ref to deploy (e.g. v0.3.0). Empty = current branch."
        required: false
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1
      - run: python3 --version
      - run: python3 scripts/site.py validate
      - run: python3 scripts/site.py verify
      - run: cat dist/build-info.json | head -8
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          path: dist/site
          include-hidden-files: true   # REQUIRED: ships /.well-known (NIP-05, LNURL fallbacks)
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Smoke test live routes
        run: |
          set -eu
          sleep 20
          ver=$(cat VERSION)
          for i in 1 2 3 4 5 6; do
            curl -fsS "https://bitnode.one/?cb=$GITHUB_RUN_ID-$i" | grep -q "bitnode-site $ver" && break
            [ "$i" = 6 ] && { echo "version $ver not live"; exit 1; }; sleep 15
          done
          curl -fsS https://bitnode.one/.well-known/nostr.json | python3 -c "import json,sys; assert json.load(sys.stdin)['names']"
          curl -fsS https://bitnode.one/.well-known/lnurlp/albihub | grep -q payRequest
          curl -fsS https://bitnode.one/.well-known/lnurlp/bitmax  | grep -q payRequest
          echo "smoke OK"
